label: "Fires on 'either'; negative on 'both', 'if', 'when'"
positive:
  status: explained
  confidence: high
  cue_type: lexical
  explanation: >-
    Fires on the word "either", most strongly in "Either way," and "In either case,", often right after a sentence
    that set out two alternatives ("...or maybe I just couldn’t bring myself to let it go. Either way, I wish I had").
    All 32 top exemplars (max +29.6, 31 documents) are "either"; 21 of them are followed by "way" and 4 by "case",
    and 19 come right after a period or line break.
    Of the 391 firings at +10 or more, 354 (90.5%) are on "either" and 24 on "neither".
  fires_on: >-
    'either' (unstored counted as 0): 69.5% of the 1,848 "either" tokens pass pos_q999 (+3.59), 19.2% reach +10,
    median +5.55. Strongest with a fixed following word: "either way" 96.2% past q999 and 79.7% at +10 or more (n=79),
    "either case" 17 of 17 past q999 (n=17), "either party" 17 of 18, "either side" 35 of 40. "neither" is a weaker
    cousin (55% past q999, n=406). Smaller firings (q999 and up) also land on "both" (18% of them), "since" (10%),
    "after" (8%) and "until" (4%).
  not_on: >-
    "or" (1 of 41,407 tokens past q999), "any" (3 of 11,168), "each" (71 of 5,678, 1.3%). "either" in weak
    positions is lower: "either be" 8 of 18 past q999 and none at +10 ("either" followed by "to" reaches +10 in 1 of 22).
    Sparse-tier rates (top 64 neurons per token), so these are floors.
